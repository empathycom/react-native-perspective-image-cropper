// Top-level build file where you can add configuration options common to all sub-projects/modules.
def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'

android {
    namespace 'fr.michaelvilleneuve.customcrop'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // OpenCV 4.11+ is the first release whose Maven Central binaries are
    // 16 KB-aligned (libopencv_java4.so), satisfying Google Play's Android
    // 15+ page-size requirement. 4.10.0 still shipped 4 KB-aligned binaries.
    implementation 'org.opencv:opencv:4.11.0'
    implementation 'com.facebook.react:react-native:+'
}
