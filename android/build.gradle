// Top-level build file where you can add configuration options common to all sub-projects/modules.
def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'

android {
    namespace 'fr.michaelvilleneuve.customcrop'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // OpenCV 4.12.0 (July 2025) added 16 KB-aligned `libopencv_java4.so` to
    // its Android Maven publication. 4.10 and 4.11 still shipped 4 KB-aligned
    // LOAD segments and were rejected by Android 15+'s page-size check.
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.facebook.react:react-native:+'
}
