// Top-level build file where you can add configuration options common to all sub-projects/modules.
def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: 'com.android.library'

android {
    namespace 'fr.michaelvilleneuve.customcrop'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // OpenCV 4.10+ ships 16 KB-aligned native binaries (libopencv_java4.so),
    // replacing the old bundled OpenCV 3.10 (libopencv_java3.so) which was
    // flagged by Google Play for Android 15+ 16 KB page-size compliance.
    implementation 'org.opencv:opencv:4.10.0'
    implementation 'com.facebook.react:react-native:+'
}
